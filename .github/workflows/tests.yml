name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - name: Lint
        run: ruff check custom_components tests
      - name: Debug snapshot discovery
        run: |
          locale; python -c "import sys,locale;print(sys.version, sys.flags.utf8_mode, locale.getpreferredencoding())"
          python - <<'EOF'
          from pathlib import Path
          from syrupy.extensions.amber.serializer import AmberDataSerializer
          p = Path("tests/snapshots/test_entities.ambr")
          print(p.resolve(), p.stat().st_size)
          print([s.name for s in AmberDataSerializer.read_file(p)])
          EOF
      - name: Test
        run: pytest --cov --cov-report=term-missing
